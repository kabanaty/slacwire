name: Tests

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  unittest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-deps .
          python -m pip install matplotlib numpy sqlalchemy pyyaml pytest pydantic pyepics h5py pykern
          # slac_devices.wire (speed-check types) without the full accelerator stack
          # (no slicops / slac-measurements); slac-tools imports slac_db -> pykern.
          python -m pip install --no-deps \
            "slac-db @ git+https://github.com/slaclab/slac-db.git@main" \
            "slac-tools @ git+https://github.com/slaclab/slac-tools.git@main" \
            "slac-timing @ git+https://github.com/slaclab/slac-timing.git@master" \
            "slac-devices @ git+https://github.com/slaclab/slac-devices.git@main"

      - name: Run unit tests
        run: |
          python -m pytest tests/ -v
